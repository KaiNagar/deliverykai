<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15202A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DeliveryKai">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>DeliveryKai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600&family=Secular+One&display=swap">
<style>
/* Layout: one-screen field tool — sticky search header, scrolling list, fixed bottom bar; address card opens as a full-height sheet. Built for one thumb, sunlight and night. */
:root{
  --bg:#EEF0EC; --surface:#FFFFFF; --ink:#15202A; --muted:#5B6770; --line:#D5DAD4;
  --accent:#D88A00; --accent-ink:#1C1300; --accent-soft:#FBEBC8;
  --code-bg:#15202A; --code-fg:#FFD166;
  --ok:#1E7A4C; --ok-soft:#DDF1E6; --no:#B42318; --no-soft:#FBE3E0; --ask:#7A6200; --ask-soft:#F4ECCB;
  --f-display:"Secular One","Assistant",system-ui,sans-serif;
  --f-body:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-code:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151B; --surface:#16202A; --ink:#E7ECEE; --muted:#93A0A9; --line:#26333E;
  --accent:#F0AE38; --accent-ink:#1C1300; --accent-soft:#3A2B0E;
  --code-bg:#090F14; --code-fg:#FFD166;
  --ok:#53C892; --ok-soft:#123326; --no:#FF7B70; --no-soft:#3A1715; --ask:#E6C454; --ask-soft:#332B0C;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E151B; --surface:#16202A; --ink:#E7ECEE; --muted:#93A0A9; --line:#26333E;
  --accent:#F0AE38; --accent-ink:#1C1300; --accent-soft:#3A2B0E;
  --code-bg:#090F14; --code-fg:#FFD166;
  --ok:#53C892; --ok-soft:#123326; --no:#FF7B70; --no-soft:#3A1715; --ask:#E6C454; --ask-soft:#332B0C;
  color-scheme:dark;}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;direction:rtl;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;min-height:100%;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 8px)}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 12px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tgls{display:flex;gap:6px;margin-inline-start:auto;margin-inline-end:8px}
.tgl{width:38px;height:32px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0}
.tgl[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.brand h1{margin:0;font-family:var(--f-display);font-size:1.45rem;font-weight:400;letter-spacing:.01em}
.status{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.cloud{background:var(--ok)} .dot.local{background:var(--accent)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:0 12px;min-height:50px}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:1.05rem;padding:12px 0;outline:none}
.search svg{flex:none;color:var(--muted)}
.clear{border:0;background:none;color:var(--muted);padding:6px;font-size:1.2rem;line-height:1}
main{flex:1;padding:12px 16px;display:grid;gap:10px;align-content:start;max-width:720px;width:100%;margin:0 auto}
.banner{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:.92rem;display:grid;gap:8px}
.banner b{font-weight:700}
.banner .row{display:flex;gap:8px;flex-wrap:wrap}
.meta{font-size:.85rem;color:var(--muted)}
.street-h{font-size:.78rem;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:8px 2px 0}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:right;width:100%}
.item:active{transform:scale(.995)}
.item .addr{font-weight:700;font-size:1.08rem;min-width:0}
.item .sub{grid-column:1/2;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.85rem;color:var(--muted);min-width:0}
.item .codes-mini{grid-row:1/3;grid-column:2/3;font-family:var(--f-code);font-weight:600;background:var(--code-bg);color:var(--code-fg);border-radius:8px;padding:6px 10px;direction:ltr;font-size:1rem;font-variant-numeric:tabular-nums;max-width:9.5em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .codes-mini.none{background:transparent;color:var(--muted);border:1px dashed var(--line);font-family:var(--f-body);font-weight:400;font-size:.8rem;direction:rtl}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:.78rem;font-weight:700;line-height:1.5}
.chip.yes{background:var(--ok-soft);color:var(--ok)} .chip.no{background:var(--no-soft);color:var(--no)} .chip.ask{background:var(--ask-soft);color:var(--ask)}
.chip.demo{background:var(--accent-soft);color:var(--ink)}
.dist{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.empty{text-align:center;color:var(--muted);padding:32px 12px;display:grid;gap:12px;justify-items:center}
.empty h2{margin:0;font-family:var(--f-display);font-weight:400;color:var(--ink);font-size:1.25rem}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:700;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--no);border-color:var(--no-soft)}
.btn.danger.armed{background:var(--no);color:#fff;border-color:var(--no)}
.btn.small{min-height:38px;padding:6px 12px;font-size:.9rem;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
nav.bottom{position:fixed;inset-inline:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);display:grid;grid-template-columns:repeat(6,1fr)}
nav.bottom button{border:0;background:none;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.72rem;white-space:nowrap;font-weight:600;color:var(--muted);min-width:0}
nav.bottom button[aria-current="page"]{color:var(--ink)}
nav.bottom button[aria-current="page"] svg{color:var(--accent)}
nav.bottom button.add svg{background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:4px;width:32px;height:32px}
/* sheet */
.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
.sheet-top{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);z-index:2}
.sheet-top h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.3rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{border:0;background:var(--surface);border-radius:12px;width:46px;height:46px;display:grid;place-items:center;flex:none;border:1px solid var(--line)}
.sheet-body{padding:14px 16px;display:grid;gap:16px;max-width:720px;margin:0 auto}
.door{border-radius:14px;padding:14px 16px;font-weight:800;font-size:1.15rem;display:flex;align-items:center;gap:10px}
.door.yes{background:var(--ok-soft);color:var(--ok)} .door.no{background:var(--no-soft);color:var(--no)} .door.ask{background:var(--ask-soft);color:var(--ask)}
.door small{display:block;font-weight:600;font-size:.82rem;opacity:.85}
.codes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.code{background:var(--code-bg);color:var(--code-fg);border:0;border-radius:14px;padding:12px 14px;text-align:right;display:grid;gap:2px}
.code .lbl{font-size:.8rem;color:#C9D2D8;font-weight:600}
.code .val{font-family:var(--f-code);font-weight:600;font-size:1.9rem;direction:ltr;text-align:right;letter-spacing:.06em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.code .hint{font-size:.72rem;color:#8C99A2}
.block{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:10px}
.block h3{margin:0;font-size:.78rem;letter-spacing:.06em;color:var(--muted);font-weight:700}
.phone{font-family:var(--f-code);direction:ltr;text-align:right;font-size:1.25rem;user-select:all;font-variant-numeric:tabular-nums}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.log-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.log-grid .btn{min-height:56px;font-size:.95rem}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:0}
.hist li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.hist li:last-child{border-bottom:0}
.hist time{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.notes{white-space:pre-wrap;overflow-wrap:anywhere}
/* forms */
.form{display:grid;gap:14px}
.f-row{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.f-row3{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:grid;gap:5px;font-weight:700;font-size:.9rem;min-width:0}
label.f span.opt{font-weight:400;color:var(--muted)}
.inp{width:100%;min-width:0;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;font-size:1.05rem;min-height:48px}
.inp:focus{border-color:var(--accent);outline:none}
.inp.code-inp{font-family:var(--f-code);direction:ltr;text-align:right}
textarea.inp{min-height:96px;resize:vertical}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{border:1.5px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center;font-weight:700;font-size:.88rem;background:var(--surface);cursor:pointer;min-height:48px;display:grid;place-items:center}
.seg input:checked+label{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.seg input:focus-visible+label{outline:3px solid var(--accent);outline-offset:2px}
.code-row{display:grid;grid-template-columns:7em 1fr 46px;gap:8px;align-items:center}
.preview{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.preview table{border-collapse:collapse;width:100%;min-width:480px;font-size:.88rem}
.preview th,.preview td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
.preview th{font-size:.75rem;color:var(--muted);letter-spacing:.04em}
.preview td.c{font-family:var(--f-code);direction:ltr;text-align:right;white-space:nowrap}
.tag{font-size:.72rem;font-weight:700;border-radius:6px;padding:1px 6px}
.tag.new{background:var(--ok-soft);color:var(--ok)} .tag.upd{background:var(--ask-soft);color:var(--ask)}
.progress{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.drive{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
.drive.on{border-color:var(--ok)}
.drive b{display:block}
.switch{width:58px;height:34px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;background:var(--surface);transition:right .18s}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{right:28px}
.scrollbtns{position:fixed;inset-inline-start:8px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 12px);z-index:25;display:flex;flex-direction:column;gap:8px}
.scrollbtns button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);opacity:.88;box-shadow:0 2px 8px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.toast{position:fixed;inset-inline:16px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);z-index:50;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;font-weight:600;text-align:center;max-width:520px;margin:0 auto}
.kbd{font-family:var(--f-code);direction:ltr;display:inline-block;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:.85em}
.help{font-size:.88rem;color:var(--muted);margin:0}
.help pre{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;margin:6px 0 0;font-family:var(--f-body);color:var(--ink)}
.res-summary{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.res-list{display:grid;gap:8px}
.res{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.res.open{border-color:var(--ink);box-shadow:0 2px 0 var(--line)}
.res-head{width:100%;border:0;background:none;text-align:right;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center}
.res-loc{font-family:var(--f-display);font-size:1.15rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.res-loc.none{font-family:var(--f-body);font-size:.85rem;color:var(--muted)}
.res-name{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-last{grid-column:1/-1;font-size:.82rem;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-body{border-top:1px solid var(--line);padding:12px 14px;display:grid;gap:12px}
.res-note{background:var(--accent-soft);border-radius:10px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere;font-weight:600}
.hit{font-size:.85rem;color:var(--ink);font-weight:600}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec-h h3{margin:0;font-size:.78rem;letter-spacing:.06em;color:var(--muted);font-weight:700}
.today-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.today-head h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.35rem}
.stats{display:flex;gap:14px;font-size:.85rem;color:var(--muted)}
.stats b{font-size:1.25rem;color:var(--ink);font-variant-numeric:tabular-nums;margin-inline-end:3px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.filters button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:700;font-size:.88rem;white-space:nowrap;flex:none}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stop{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.stop.done{opacity:.55}
.stop .n,.rv .n{font-family:var(--f-display);font-size:1.05rem;min-width:2em;height:2em;border-radius:8px;background:var(--bg);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.stop .main{min-width:0;display:grid;gap:4px}
.stop .t1{font-weight:700;font-size:1.05rem;overflow-wrap:anywhere}
.stop .t2{font-size:.9rem;color:var(--muted);overflow-wrap:anywhere}
.stop .t2 b{color:var(--ink)}
.stop .chips{display:flex;gap:5px;flex-wrap:wrap}
.stop .side{display:grid;gap:6px;justify-items:end}
.stop .cm{font-family:var(--f-code);font-weight:600;background:var(--code-bg);color:var(--code-fg);border-radius:8px;padding:4px 8px;direction:ltr;font-size:.95rem;white-space:nowrap}
.chip.new{background:var(--accent-soft);color:var(--ink)}
.chip.done{background:var(--ink);color:var(--bg)}
.chip.warn{background:var(--no-soft);color:var(--no)}
.rv{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.rv.bad{border-color:var(--no)}
.rv .main{min-width:0;display:grid;gap:4px}
.rv .fix{display:grid;grid-template-columns:2fr 1fr;gap:6px}
.stopbar{background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;font-weight:600;font-size:.92rem;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.next{display:grid;gap:2px;text-align:right}
.next small{font-weight:600;opacity:.8}
.auth{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 40px) 16px 40px}
.auth-box{max-width:420px;margin:0 auto;display:grid;gap:14px}
.auth-box h1{margin:0 0 4px;font-family:var(--f-display);font-weight:400;font-size:2rem}
.mapwrap{position:fixed;inset-inline:0;z-index:10;display:grid;grid-template-columns:1fr;background:var(--bg)}
.mapmain{position:relative;min-width:0;min-height:0}
#map{position:absolute;inset:0;z-index:0;background:var(--line)}
.maptools{position:absolute;top:10px;right:10px;left:10px;z-index:500;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-start;pointer-events:none}
.mbtn{pointer-events:auto;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 14px;font-weight:700;font-size:.9rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.mbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mapside{background:var(--bg);overflow-y:auto;padding:12px;display:grid;gap:8px;align-content:start;min-height:0}
.ms-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ms-head h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.2rem}
.ms-list{display:grid;gap:6px}
.ms-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:right;width:100%}
.ms-row.cur{border-color:var(--ink)}
.ms-row.big{padding:12px 14px}
.ms-row.big .ms-a{font-size:1.15rem}
.ms-row .cm{font-family:var(--f-code);font-weight:600;background:var(--code-bg);color:var(--code-fg);border-radius:8px;padding:4px 9px;direction:ltr;font-size:1.05rem;white-space:nowrap}
.ms-row.big .cm{font-size:1.5rem}
.ms-a{font-weight:700;display:grid;min-width:0}
.ms-a small{font-weight:600;color:var(--muted);font-size:.8rem}
.ms-fix{background:var(--surface);border:1.5px solid var(--ink);border-radius:12px;padding:12px;display:grid;gap:8px}
.ms-addr{font-family:var(--f-display);font-size:1.25rem}
@media (max-width:899px){
  .mapside{position:absolute;inset-inline:10px;bottom:10px;z-index:600;max-height:45%;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.25);padding:8px;background:var(--bg)}
  .mapwrap{display:block}
  .mapmain{position:absolute;inset:0}
}
@media (min-width:900px){ .mapwrap{grid-template-columns:360px 1fr} .mapside{border-inline-start:0;border-inline-end:1px solid var(--line)} }
.pinwrap{background:none;border:0}
.pinbox{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px}

<script>(function(){
  const LS=(k,v)=>{ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } };
  const root=document.documentElement, bD=document.getElementById("tglDark"), bA=document.getElementById("tglAwake");
  function setDark(on){ root.setAttribute("data-theme", on?"dark":"light"); bD.setAttribute("aria-pressed", on?"true":"false"); LS("bank_codes_dark", on?"1":"0"); }
  setDark(LS("bank_codes_dark")==="1");
  bD.addEventListener("click",()=>setDark(bD.getAttribute("aria-pressed")!=="true"));
  let lock=null, want=false;
  async function grab(){ if(!want) return; try{ if(!navigator.wakeLock) throw 0; lock=await navigator.wakeLock.request("screen"); lock.addEventListener("release",()=>{ lock=null; }); }catch(e){ lock=null; } }
  async function setAwake(on, quiet){ want=on; bA.setAttribute("aria-pressed", on?"true":"false"); LS("bank_codes_awake", on?"1":"0");
    if(on){ await grab(); if(!lock && !quiet){ const t=document.getElementById("toast"); if(t){ t.textContent="המכשיר לא תומך בהשארת מסך דולק"; t.hidden=false; setTimeout(()=>t.hidden=true,2600); } } }
    else if(lock){ try{ await lock.release(); }catch(e){} lock=null; } }
  bA.addEventListener("click",()=>setAwake(bA.getAttribute("aria-pressed")!=="true"));
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && want && !lock) grab(); });
  if(LS("bank_codes_awake")==="1") setAwake(true,true);
})();</script>

    const a=open||y<300, b=open||(h-v-y)<300; if(up.hidden!==a) up.hidden=a; if(dn.hidden!==b) dn.hidden=b; }
  up.addEventListener("click",()=>window.scrollTo({top:0,behavior:"smooth"}));
  dn.addEventListener("click",()=>window.scrollTo({top:document.documentElement.scrollHeight,behavior:"smooth"}));
  window.addEventListener("scroll",upd,{passive:true}); window.addEventListener("resize",upd);
  let raf=0; new MutationObserver(()=>{ if(!raf) raf=requestAnimationFrame(()=>{ raf=0; upd(); }); }).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:["hidden"]});
  upd();
})();</script>

const RES_DEFAULT = () => ({floor:"",apt:"",name:"",phone:"",door:"ask",notes:"",history:[]});
function normalize(raw){
  const it=Object.assign({street:"",num:"",entrance:"",city:"",codes:[],door:"ask",notes:"",residents:[],history:[]}, raw);
  if(!Array.isArray(it.codes)) it.codes=[];
  if(!Array.isArray(it.residents)) it.residents=[];
  if(!Array.isArray(it.history)) it.history=[];
  if(it.name || it.phone){
    it.residents=[Object.assign(RES_DEFAULT(), {id:"r_"+it.id, name:it.name||"", phone:it.phone||"", history:it.history})].concat(it.residents);
    it.history=[];
  }
  delete it.name; delete it.phone;
  it.residents=it.residents.map((r,i)=>Object.assign(RES_DEFAULT(), {id:"r_"+it.id+"_"+i}, r));
  if(!DOOR[it.door]) it.door="ask";
  return it;
}
const effDoor = (r,b) => (r.door && r.door!=="ask") ? {k:r.door, def:false} : {k:b.door||"ask", def:(b.door||"ask")!=="ask"};
const resLoc = r => [r.floor!==""&&r.floor!=null?"קומה "+r.floor:null, r.apt?"דירה "+r.apt:null].filter(Boolean).join(" · ");
const sortRes = list => list.slice().sort((a,b)=>numVal(a.floor)-numVal(b.floor) || numVal(a.apt)-numVal(b.apt) || String(a.name).localeCompare(String(b.name),"he"));

let UID=null;
const OB_KEY = () => "bank_codes_outbox_"+(UID||"local");
function obGet(){ try{ return JSON.parse(localStorage.getItem(OB_KEY())||"{}")||{}; }catch(e){ return {}; } }
function obSet(o){ try{ localStorage.setItem(OB_KEY(), JSON.stringify(o)); }catch(e){} }

const store = {
  map:new Map(), flushing:false, retryT:null,
  all(){ return [...this.map.values()]; },
  get(id){ return this.map.get(id); },
  cache(){ clearTimeout(this._ct); this._ct=setTimeout(()=>lsSet(this.all()),300); },
  body(it){ const b=JSON.parse(JSON.stringify(it)); delete b.id; return b; },
  async start(){
    dayLoad(); newsLoadLocal(); lockWire();
    const cached=lsGet();
    if(Array.isArray(cached)) cached.forEach(it=>it&&it.id&&this.map.set(it.id,normalize(it)));
    render();
    if(!sb){ setMode("local"); if(!CFG.demo) showSetupError(); return; }
    const { data } = await sb.auth.getSession();
    if(!data || !data.session){ showAuth(); return; }
    UID=data.session.user.id; $("#who").textContent=data.session.user.email||"";
    await this.load();
    window.addEventListener("online", ()=>this.flush());
    document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible"){ this.flush().then(()=>this.load()); } });
  },
  async load(){
    if(!sb||!UID) return;
    const rows=[]; let from=0;
    try{
      for(;;){
        const { data, error } = await sb.from("buildings").select("id,data").order("id").range(from, from+999);
        if(error) throw error;
        rows.push(...data);
        if(data.length<1000) break; from+=1000;
      }
    }catch(e){ setMode("offline"); return; }
    const m=new Map();
    rows.forEach(r=>{ if(!r||!r.data) return; if(String(r.id).startsWith("__")){ if(r.id==="__news") newsMergeRemote(r.data); return; } m.set(r.id, normalize(Object.assign({}, r.data, {id:r.id}))); });
    const ob=obGet();
    Object.entries(ob).forEach(([id,op])=>{ if(id.startsWith("__")) return; if(op.op==="d") m.delete(id); else if(op.data) m.set(id, normalize(Object.assign({}, op.data, {id}))); });
    this.map=m; this.cache(); setMode(Object.keys(ob).length?"pending":"cloud");
    if(S.openId) refreshCard(); else render();
    if(Object.keys(ob).length) this.flush();
  },
  queue(id, op){ const ob=obGet(); ob[id]=op; obSet(ob); },
  async flush(){
    if(!sb||!UID||this.flushing) return;
    this.flushing=true; clearTimeout(this.retryT);
    try{
      for(;;){
        const ob=obGet(); const ids=Object.keys(ob); if(!ids.length) break;
        const ups=ids.filter(id=>ob[id].op==="u").slice(0,200);
        const dels=ids.filter(id=>ob[id].op==="d").slice(0,200);
        if(ups.length){
          const rows=ups.map(id=>({id, user_id:UID, data:ob[id].data, updated_at:new Date().toISOString()}));
          const { error } = await sb.from("buildings").upsert(rows);
          if(error) throw error;
        }
        if(dels.length){
          const { error } = await sb.from("buildings").delete().in("id", dels);
          if(error) throw error;
        }
        const now=obGet();
        [...ups,...dels].forEach(id=>{ if(now[id] && now[id].v===ob[id].v) delete now[id]; });
        obSet(now);
      }
      setMode("cloud");
    }catch(e){
      setMode("pending");
      this.retryT=setTimeout(()=>this.flush(), 20000);
      this.flushing=false; return;
    }
    this.flushing=false;
    if(Object.keys(obGet()).length) setTimeout(()=>this.flush(), 300);
  },
  async save(it){
    it.updated=Date.now(); this.map.set(it.id,it); this.cache();
    this.queue(it.id, {op:"u", data:this.body(it), v:Date.now()+Math.random()});
    setMode("pending"); await this.flush();
  },
  async remove(id){
    this.map.delete(id); this.cache();
    this.queue(id, {op:"d", v:Date.now()+Math.random()});
    setMode("pending"); await this.flush();
  },
  async bulk(items, onProgress){
    const ob=obGet();
    items.forEach(it=>{ it.updated=Date.now(); this.map.set(it.id,it); ob[it.id]={op:"u", data:this.body(it), v:Date.now()+Math.random()}; });
    obSet(ob); this.cache(); onProgress(Math.round(items.length/2));
    await this.flush(); onProgress(items.length);
    if(Object.keys(obGet()).length) toast("נשמר במכשיר. יסונכרן לחשבון כשיהיה חיבור.");
    return [];
  },
  write(id, fn){ return Promise.resolve().then(fn).catch(()=>{}); }
};
function setMode(m){

  $("#statusText").textContent = m==="cloud" ? "מסונכרן" : m==="pending" ? "ממתין לחיבור…" : m==="offline" ? "אין חיבור · עובד מהמכשיר" : m==="local" ? (CFG.demo?"מצב הדגמה":"לא מחובר לענן") : "טוען…";

/* ---------- map ---------- */
const M={map:null, layer:null, markers:new Map(), me:null, meAcc:null, follow:false, watch:null, showAll:false, fixId:null, fixMarker:null, wake:null, fitted:false};
const NEAR_M=70;
const isWide=()=>window.matchMedia("(min-width: 900px)").matches;
function layoutMap(){
  const w=$("#mapWrap"); if(!w||w.hidden) return;
  const h=document.querySelector("header.top"), nav=document.querySelector("nav.bottom");
  w.style.top=Math.max(0,h.getBoundingClientRect().bottom)+"px";

function mapPoints(){ const q=norm(S.q); return items().filter(cityOk).filter(it=>it.lat!=null && it.lng!=null && matches(it,q)); }
function ensureMap(){
  if(M.map || !window.L) return;
  M.map=L.map("map",{zoomControl:true, attributionControl:true, maxZoom:19}).setView([32.0823,34.8141], 14);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19, attribution:"© OpenStreetMap"}).addTo(M.map);
  M.layer=L.layerGroup().addTo(M.map);

  M.map.on("click",e=>{ if(M.fixId && M.fixMarker) M.fixMarker.setLatLng(e.latlng); });

  M.map.on("popupopen", e=>{ const el=e.popup.getElement(); const c=el&&el.querySelector(".leaflet-popup-content"); if(c && !c._wired){ c._wired=true; c.addEventListener("click", ev=>{ const a=ev.target.closest("[data-act],[data-copy]"); if(!a) return; if(a.tagName==="A") return; ev.stopPropagation(); if(a.dataset.copy){ copy(a.dataset.copy); return; } dayAct(a.dataset.act,a); }); } });

function fitOnce(){

function pinIcon(it, open, dist){

  return L.divIcon({className:"pinwrap", iconSize:[0,0], iconAnchor:[0,0], html:
    `<div class="pinbox open"><div class="pin-card ${cls}" dir="rtl">
      <div class="pc-addr">${esc(it.street)} ${esc(it.num)}${it.entrance?" · "+esc(it.entrance):""}</div>
      ${codes.length?`<div class="pc-code">${esc(codes.join(" · "))}</div>`:`<div class="pc-none">אין קוד</div>`}
      ${dist!=null?`<div class="pc-d">${fmtDist(dist)}${cls==="approx"?" · מיקום משוער":""}</div>`:(cls==="approx"?`<div class="pc-d">מיקום משוער</div>`:"")}
    </div><div class="pin ${cls}"></div></div>`});
}
function nearSet(list){
  const s=new Set(); if(!S.pos) return s;
  list.map(it=>({it,d:haversine(S.pos,it)})).filter(x=>x.d<=NEAR_M).sort((a,b)=>a.d-b.d).slice(0,4).forEach(x=>s.add(x.it.id));
  return s;
}
function mapUpdate(){
  ensureMap(); if(!M.map) return;
  const list=mapPoints(); const near=nearSet(list); const keep=new Set(); const onRoute=dayOpenBuildingIds();
  list.forEach(it=>{
    if(it.id===M.fixId) return;
    keep.add(it.id);
    const d=S.pos?haversine(S.pos,it):null;
    const open=(M.showAll||near.has(it.id)) && !onRoute.has(it.id);
    const key=[it.lat,it.lng,open,it.geo,(it.codes||[]).map(c=>c.value).join(),it.street,it.num,it.entrance,open&&d!=null?Math.round(d/5):""].join("|");
    let m=M.markers.get(it.id);
    if(!m){
      m=L.marker([it.lat,it.lng],{icon:pinIcon(it,open,d), keyboard:false, zIndexOffset:open?1000:0});
      m.on("click",()=>{ if(S.fixMode){ startFix(it.id); return; } openCard(it.id); });
      m._k=key; m.addTo(M.layer); M.markers.set(it.id,m);
    } else if(m._k!==key){ m.setLatLng([it.lat,it.lng]); m.setIcon(pinIcon(it,open,d)); m.setZIndexOffset(open?1000:0); m._k=key; }
  });
  [...M.markers.keys()].forEach(id=>{ if(!keep.has(id)){ M.layer.removeLayer(M.markers.get(id)); M.markers.delete(id); } });
  dayUpdate(); fitOnce(); mapSide(); mapToolbar();
}
function drawMe(){

  if(!M.me){
    M.meAcc=L.circle(ll,{radius:S.pos.acc||20, weight:0, fillColor:"#2F7DF6", fillOpacity:.12, interactive:false}).addTo(M.map);
    M.me=L.circleMarker(ll,{radius:8, color:"#fff", weight:3, fillColor:"#2F7DF6", fillOpacity:1, interactive:false}).addTo(M.map);
  } else { M.me.setLatLng(ll); M.meAcc.setLatLng(ll); M.meAcc.setRadius(S.pos.acc||20); }
}
function startWatch(){
  if(M.watch!=null) return true;
  if(!("geolocation" in navigator)){ toast("אין גישה למיקום במכשיר הזה."); return false; }
  M.watch=navigator.geolocation.watchPosition(p=>{
    S.pos={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}; S.posT=Date.now(); S.posErr=null;
    drawMe();
    if(M.follow && M.map) M.map.setView([S.pos.lat,S.pos.lng], Math.max(M.map.getZoom(),17), {animate:true});
    if(S.view==="map") mapUpdate();

function fixList(){ return sorted(items().filter(cityOk).filter(it=>it.lat==null||it.geo==="approx")); }
function startFix(id){

function sideRow(it,d,big){

function parseRoute(text, defCity){
  const out=[];
  String(text).split(/\r?\n/).forEach(line=>{
    line=line.trim(); if(!line) return;
    let no="", addr="", city="", info="";
    const parts=line.split("|").map(x=>x.trim());
    if(parts.length>=2){ no=parts[0].replace(/\D/g,""); addr=parts[1]; city=parts[2]||""; info=parts.slice(3).join(" · "); }
    else {
      const m=line.match(/^#?(\d{1,3})[\s.):\-]+(.*)$/); if(m){ no=m[1]; addr=m[2]; } else addr=line;
      const c=addr.split(","); if(c.length>1){ addr=c[0].trim(); city=c.slice(1).join(",").trim(); }
    }
    const a=splitAddr(addr); if(!a.street||!a.num) return;
    out.push({id:newId(), no:no||String(out.length+1), street:a.street, num:a.num, city:city||defCity||"", info, done:false});
  });
  return out;
}

  if(b && b.lat!=null) return {lat:b.lat, lng:b.lng, geo:b.geo||"auto", b};
  if(st.lat!=null) return {lat:st.lat, lng:st.lng, geo:st.geo||"approx", b};
  return {lat:null, lng:null, geo:null, b};
}

async function geocodeDay(){
  if(D.geoBusy) return;
  const cache=geoCacheGet();
  const todo=D.stops.filter(st=>dayLoc(st).lat==null);
  todo.forEach(st=>{ const k=norm(dayAddr(st)+" "+st.city); if(cache[k]){ Object.assign(st, cache[k]); } });
  daySave();
  const left=D.stops.filter(st=>dayLoc(st).lat==null);
  if(!left.length){ mapUpdate(); fitDay(); return; }
  D.geoBusy=true; mapUpdate(); fitDay();
  for(let i=0;i<left.length;i++){
    const st=left[i];
    D.geoMsg=`מאתר כתובות ${i+1}/${left.length}`; mapSide();
    try{
      const g=await geoLookup({street:st.street, num:st.num, city:st.city});
      if(g){ Object.assign(st,g); cache[norm(dayAddr(st)+" "+st.city)]=g; geoCacheSet(cache); daySave(); mapUpdate(); }
    }catch(e){ await sleepMs(1500); }
  }
  D.geoBusy=false; D.geoMsg="";
  const miss=D.stops.filter(st=>dayLoc(st).lat==null).length;
  mapUpdate(); fitDay();
  if(miss) toast(`${miss} כתובות לא אותרו — הן מופיעות ברשימה בלי סיכה.`);
}

function parseDays(t){
  t=String(t||"").trim();
  if(!t||/כל|יומי|הכל/.test(t)) return "";
  t=t.replace(/שישי/g,"ו").replace(/חמישי/g,"ה").replace(/רביעי/g,"ד").replace(/שלישי/g,"ג").replace(/שני/g,"ב").replace(/ראשון/g,"א").replace(/יום/g,"").replace(/בלבד/g,"").trim();
  const r=t.match(/^([א-ו])['׳]?\s*[-–]\s*([א-ו])['׳]?$/);
  if(r){ const a=DAYS_HE.indexOf(r[1]), b=DAYS_HE.indexOf(r[2]); if(a>=0&&b>=a) return Array.from({length:b-a+1},(_,i)=>a+i).join(""); }

function newsPlan(text, defCity){

          const rk=streetRank(s.street);
          if(street.length && !isNaN(n) && rk){
            const r0=rk(n); const after=street.filter(o=>rk(o.n)<=r0);

          } else if(street.length && !isNaN(n)){
            const best=street.reduce((a,b)=>Math.abs(b.n-n)<Math.abs(a.n-n)?b:a);
            const grp=street.filter(o=>o.n===best.n);

    }
    if(act==="הזז"){
      const k=r.findIndex((x,i)=>i>0&&/^(לפני|אחרי)$/.test(x));
      if(k<0){ errors.push(r.join(" | ")+" (חסר לפני/אחרי)"); return; }
      const pick=parts=>{ const ad=splitNewsAddr(parts[0]); const f=parseFA(parts[1]);
        return list.filter(x=>streetEq(x.street,ad.street)&&normNum(x.num)===normNum(ad.num)&&(!f.apt||normNum(x.apt)===normNum(f.apt))&&(!f.floor||String(x.floor)===String(f.floor))); };
      const src=pick(r.slice(1,k)), tgt=pick(r.slice(k+1));
      if(!src.length||!tgt.length){ errors.push(r.join(" | ")+" (כתובת לא נמצאה)"); return; }

const NLOG_KEY="bank_codes_newslog";
function nlogGet(){ try{ return JSON.parse(localStorage.getItem(NLOG_KEY)||"{}")||{}; }catch(e){ return {}; } }
function nlogSet(o){
  try{ const keys=Object.keys(o).sort(); while(keys.length>21){ delete o[keys.shift()]; } localStorage.setItem(NLOG_KEY, JSON.stringify(o)); }catch(e){}

function newsRecord(items){
  if(!items||!items.length) return;
  const now=Date.now(); const s0=items[0];
  const fresh = S.pos && S.posT && (now-S.posT)<20000;
  const ev={t:now, a:`${s0.street} ${s0.num}${s0.entrance?" "+s0.entrance:""}`, o:s0.order};

  const log=nlogGet(); const k=dayKey(); (log[k]=log[k]||[]).push(ev); nlogSet(log);
  if(fresh && (S.pos.acc||999)<=40){
    let ch=false;
    N.list.forEach(x=>{
      if(streetEq(x.street,s0.street)&&normNum(x.num)===normNum(s0.num)&&norm(x.entrance)===norm(s0.entrance)){

  }
}

function lockWire(){
  const el=$("#walkLock"); if(!el||el._w) return; el._w=true;
  const btn=el.querySelector(".wl-btn");
  const stop=e=>{ e.preventDefault(); e.stopPropagation(); };
  ["click","touchstart","touchend","pointerdown","pointerup","contextmenu"].forEach(t=>el.addEventListener(t, e=>{ if(!btn.contains(e.target)) stop(e); }, {passive:false}));
  const start=e=>{ stop(e); btn.classList.add("hold"); clearTimeout(lockTimer); lockTimer=setTimeout(()=>{ btn.classList.remove("hold"); lockOff(); }, 900); };
  const end=e=>{ stop(e); btn.classList.remove("hold"); clearTimeout(lockTimer); };
  btn.addEventListener("pointerdown", start); btn.addEventListener("pointerup", end); btn.addEventListener("pointerleave", end); btn.addEventListener("pointercancel", end);
  document.addEventListener("visibilitychange", async ()=>{ if(document.visibilityState==="visible" && !el.hidden && !lockWake){ try{ if(navigator.wakeLock) lockWake=await navigator.wakeLock.request("screen"); }catch(e){} } });
}

/* ---------- automatic locations (OpenStreetMap) ---------- */
const sleepMs=ms=>new Promise(r=>setTimeout(r,ms));
async function geoLookup(it){
  const city=it.city||"";
  const tries=[
    {street:`${it.num} ${it.street}`, city, country:"ישראל"},
    {q:`${it.street} ${it.num}, ${city}, ישראל`}
  ];
  for(const t of tries){
    const u=new URL("https://nominatim.openstreetmap.org/search");
    Object.entries(t).forEach(([k,v])=>{ if(v) u.searchParams.set(k,v); });
    u.searchParams.set("format","jsonv2"); u.searchParams.set("addressdetails","1"); u.searchParams.set("limit","1");
    u.searchParams.set("countrycodes","il"); u.searchParams.set("accept-language","he");
    const r=await fetch(u.toString(), {headers:{"Accept":"application/json"}});
    if(r.status===429){ await sleepMs(5000); continue; }
    if(!r.ok) throw new Error("http "+r.status);
    const arr=await r.json(); await sleepMs(1100);
    if(Array.isArray(arr)&&arr.length){
      const x=arr[0], a=x.address||{};
      const exact = !!a.house_number && String(a.house_number).replace(/\D/g,"")===String(it.num).replace(/\D/g,"");
      return {lat:+x.lat, lng:+x.lon, geo: exact?"auto":"approx"};
    }
  }
  return null;
}
async function geocodeAll(){
  if(S.geoBusy) return;
  const list=store.all().filter(i=>i.lat==null && i.street && i.num);
  if(!list.length) return;
  S.geoBusy=true; let found=0, approx=0, miss=0;
  const upd=(i)=>{ S.geo=`${i} מתוך ${list.length} · נמצאו ${found}${approx?` (${approx} משוערים)`:""}${miss?` · לא נמצאו ${miss}`:""}`; const g=$("#geoProg"); if(g) g.textContent=S.geo; };
  render(); upd(0);
  for(let i=0;i<list.length;i++){
    const it=list[i];
    try{
      const g=await geoLookup(it);
      if(g){ const cur=store.get(it.id); if(cur && cur.lat==null){ await store.save(Object.assign({},cur,g)); found++; if(g.geo==="approx") approx++; } }
      else miss++;
    }catch(e){ miss++; await sleepMs(2000); }
    upd(i+1);
  }
  S.geoBusy=false; render();
  toast(`נמצאו מיקומים ל־${found} בניינים${miss?` · ${miss} לא נמצאו`:""}`);
}

    <h1>DeliveryKai</h1>
    <p class="help">כניסה עם אימייל וסיסמה. בפעם הראשונה לחץ ״יצירת חשבון״.</p>

async function doAuth(kind){
  const email=$("#a_email").value.trim(), password=$("#a_pass").value;
  const err=$("#a_err");
  if(!email||password.length<6){ err.textContent="צריך אימייל וסיסמה של 6 תווים לפחות."; err.hidden=false; return; }
  err.hidden=true;
  const res = kind==="up" ? await sb.auth.signUp({email,password}) : await sb.auth.signInWithPassword({email,password});
  if(res.error){
    const m=String(res.error.message||"");
    err.textContent = /Invalid login/i.test(m) ? "אימייל או סיסמה לא נכונים." :
      /not confirmed/i.test(m) ? "צריך לאשר את האימייל, או לכבות אישור אימייל בהגדרות." :
      /already registered/i.test(m) ? "החשבון כבר קיים. לחץ כניסה." :
      /signups? not allowed|disabled/i.test(m) ? "הרשמה סגורה. לחץ כניסה." : "שגיאה: "+m;
    err.hidden=false; return;
  }
  if(!res.data.session){ err.textContent="נשלח אימייל לאישור. אשר אותו ואז לחץ כניסה."; err.hidden=false; return; }
  UID=res.data.session.user.id; $("#who").textContent=res.data.session.user.email||"";
  $("#auth").hidden=true; $("#auth").innerHTML="";
  await store.load();
  if(!store.map.size) toast("מחובר. ייבא את הגיבוי דרך עוד ← פתח ייבוא.");
}

const isDemo = () => false;

/* ---------- filtering ---------- */
const resHay = r => norm([r.name,r.phone,r.apt?"דירה "+r.apt:"",r.notes].join(" "));
const allWords = (hay,q) => q.split(" ").every(w=>hay.includes(w));
function buildingHay(it){ return norm([it.street,it.num,it.entrance,it.city,it.notes,(it.codes||[]).map(c=>c.value).join(" ")].join(" ")); }
function matches(it, q){
  if(!q) return true;
  return allWords(buildingHay(it)+" "+(it.residents||[]).map(resHay).join(" "), q);
}
function residentHit(it, q){
  if(!q || allWords(buildingHay(it),q)) return null;
  const words=q.split(" ").filter(w=>!buildingHay(it).includes(w));
  return (it.residents||[]).find(r=>words.every(w=>resHay(r).includes(w))) || null;
}
function sorted(list){
  return list.slice().sort((a,b)=> norm(a.street).localeCompare(norm(b.street),"he") || numVal(a.num)-numVal(b.num) || norm(a.entrance).localeCompare(norm(b.entrance),"he"));
}

/* ---------- rendering ---------- */
function itemRow(it, dist, q){
  const codes=(it.codes||[]).map(c=>c.value).filter(Boolean);
  const n=(it.residents||[]).length;
  const hit=residentHit(it,q);
  const bd=DOOR[it.door];
  return `<button class="item" data-open="${esc(it.id)}"${hit?` data-rid="${esc(hit.id)}"`:""}>
    <span class="addr">${esc(addrOf(it))}</span>
    <span class="codes-mini ${codes.length?"":"none"}">${codes.length?esc(codes.join(" · ")):"אין קוד"}</span>
    <span class="sub">
      ${it.door!=="ask"?`<span class="chip ${bd.c}">כל הבניין: ${esc(bd.short)}</span>`:""}
      <span>${n?n+" דיירים":"אין דיירים שמורים"}</span>
      ${it.city?`<span>${esc(it.city)}</span>`:""}
      ${dist!=null?`<span class="dist">${fmtDist(dist)}</span>`:""}
      ${it.demo?`<span class="chip demo">דוגמה</span>`:""}
    </span>
    ${hit?`<span class="sub hit">← ${esc([hit.name,resLoc(hit)].filter(Boolean).join(" · "))}</span>`:""}</button>`;
}

/* ---------- city filter ---------- */
const NO_CITY="__none";
function cityList(){
  const m=new Map();
  items().forEach(it=>{ const k=norm(it.city)||NO_CITY; const e=m.get(k)||{k, name:it.city||"ללא עיר", n:0}; e.n++; m.set(k,e); });
  return [...m.values()].sort((a,b)=> (a.k===NO_CITY)-(b.k===NO_CITY) || b.n-a.n);
}
function cityOk(it){ if(!S.city) return true; return (norm(it.city)||NO_CITY)===S.city; }
function cityBar(){
  const cs=cityList();
  if(cs.length<2 && !S.city) return "";
  if(S.city && !cs.some(c=>c.k===S.city)) S.city="";
  let html=`<div class="filters" role="group" aria-label="סינון לפי עיר"><button data-city="" aria-pressed="${!S.city}">הכל</button>${cs.map(c=>`<button data-city="${esc(c.k)}" aria-pressed="${S.city===c.k}">${esc(c.name)} · ${c.n}</button>`).join("")}</div>`;
  if(S.city===NO_CITY && !isDemo()){
    const named=cs.filter(c=>c.k!==NO_CITY);
    html+=`<div class="banner"><div><b>בניינים בלי עיר.</b> שייך את כולם לעיר אחת בלחיצה.</div>
      <div class="row">${named.map(c=>`<button class="btn small" data-act="assignCity" data-name="${esc(c.name)}">העבר ל${esc(c.name)}</button>`).join("")}</div>
      <div class="row"><input class="inp" id="newCity" placeholder="עיר אחרת, למשל מודיעין" style="flex:1;min-width:0"><button class="btn small primary" data-act="assignCity">העבר</button></div></div>`;
  }
  return html;
}
async function assignCity(name){
  name=String(name||"").trim(); if(!name){ toast("הקלד שם עיר."); return; }
  const list=store.all().filter(it=>!norm(it.city)).map(it=>Object.assign({},it,{city:name}));
  if(!list.length) return;
  S.city=norm(name); try{ localStorage.setItem("bank_codes_city",S.city); }catch(e){}
  render(); toast(`מעביר ${list.length} בניינים ל${name}…`);
  const failed=await store.bulk(list,()=>{});
  render(); toast(failed.length?`${failed.length} לא נשמרו — נסה שוב.`:`${list.length} בניינים הועברו ל${name}`);
}

function viewList(){
  const q=norm(S.q);
  const all=items();
  if(!all.length) return `<div class="empty"><h2>עדיין אין כתובות</h2><p>ייבא את הרשימה שלך מקובץ או מהדבקה, או הוסף כתובת ראשונה ידנית.</p>
    <div class="btn-row"><button class="btn primary" data-go="import">ייבוא רשימה</button><button class="btn" data-go="add">הוספת כתובת</button></div></div>`;
  let html = isDemo()?demoBanner():"";
  html += cityBar();
  const inCity=all.filter(cityOk);
  const list=sorted(inCity.filter(it=>matches(it,q)));
  html += `<div class="meta">${q? `${list.length} תוצאות` : `${inCity.length} בניינים`}</div>`;
  if(!list.length) return html+`<div class="empty"><h2>לא נמצא</h2><p>אין בניין או דייר שמתאימים ל״${esc(S.q)}״.</p><button class="btn primary" data-act="addFromQuery">הוסף בניין חדש</button></div>`;
  const LIMIT=250; let last=null;
  list.slice(0,LIMIT).forEach(it=>{
    const st=it.street||"ללא רחוב";
    if(norm(st)!==last){ html+=`<div class="street-h">${esc(st)}</div>`; last=norm(st); }
    html+=itemRow(it, S.pos&&it.lat!=null? haversine(S.pos,it):null, q);
  });
  if(list.length>LIMIT) html+=`<div class="meta">מוצגים ${LIMIT} מתוך ${list.length}. חפש רחוב כדי לצמצם.</div>`;
  return html;
}
function viewNear(){
  const q=norm(S.q);
  let html=`<div class="drive ${S.drive?"on":""}"><div><b>מצב נסיעה</b><span class="meta">${S.drive?"כשתגיע לבניין שמור, הכרטיס שלו ייפתח לבד":"פותח את הכרטיס אוטומטית כשאתה מגיע לבניין"}</span></div>
    <button class="switch" role="switch" aria-checked="${S.drive}" aria-label="מצב נסיעה" data-act="toggleDrive"></button></div>`;
  if(S.posErr){
    html+=`<div class="banner"><div><b>אין גישה למיקום.</b> ${esc(S.posErr)}</div><div class="row"><button class="btn small" data-act="locate">נסה שוב</button></div></div>`;
  } else if(!S.pos){
    return html+`<div class="empty"><h2>איפה אתה?</h2><p>האפליקציה תראה את הבניינים השמורים הכי קרובים אליך.</p><button class="btn primary" data-act="locate">הצג קרובים אליי</button></div>`;
  } else {
    html+=`<div class="meta">דיוק מיקום: ±${Math.round(S.pos.acc||0)} מ׳ · <button class="btn small" data-act="locate">רענן</button></div>`;
  }
  html+=cityBar();
  const all=items().filter(cityOk);
  const withLoc=all.filter(it=>it.lat!=null && it.lng!=null && matches(it,q));
  const noLoc=all.filter(it=>it.lat==null).length;
  if(S.pos && withLoc.length){
    withLoc.map(it=>({it,d:haversine(S.pos,it)})).sort((a,b)=>a.d-b.d).slice(0,40).forEach(({it,d})=>html+=itemRow(it,d,q));
  } else if(S.pos){
    html+=`<div class="empty"><h2>אין עדיין בניינים עם מיקום</h2><p>בפעם הבאה שאתה ליד בניין, פתח את הכרטיס שלו ולחץ ״שמור מיקום כאן״. מאז האפליקציה תזהה אותו לבד.</p></div>`;
  }
  if(noLoc) html+=`<div class="meta">${noLoc} בניינים בלי מיקום שמור — עדיין אפשר למצוא אותם בחיפוש.</div>`;
  return html;
}

/* ---------- location ---------- */
function geoOk(){ return "geolocation" in navigator; }
function onPos(p){
  S.pos={lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy}; S.posT=Date.now(); S.posErr=null;
  if(S.drive) autoOpen();
  if(S.openId) refreshCard(); else if(S.view==="near"||S.view==="list") render();
}
function onPosErr(e){
  S.posErr = e && e.code===1 ? "הגישה למיקום חסומה. אפשר אותה בהגדרות הדפדפן, או פתח את האפליקציה כאתר עצמאי בטלפון." : "לא הצלחתי לקבל מיקום. בדוק שהמיקום פועל בטלפון.";
  if(S.drive) stopDrive();
  render();
}
function locate(){
  if(!geoOk()){ onPosErr({code:1}); return; }
  navigator.geolocation.getCurrentPosition(onPos, onPosErr, {enableHighAccuracy:true, timeout:12000, maximumAge:5000});
}
function autoOpen(){
  if(!S.pos) return;
  let best=null;
  store.all().forEach(it=>{ if(it.lat==null || it.geo==="approx" || !cityOk(it)) return; const d=haversine(S.pos,it); if(!best||d<best.d) best={it,d}; });
  if(S.lastAuto){ const la=store.get(S.lastAuto); if(!la || haversine(S.pos,la)>120) S.lastAuto=null; }
  if(best && best.d<=40 && best.it.id!==S.lastAuto && S.openId!==best.it.id){
    S.lastAuto=best.it.id; openCard(best.it.id);
    try{ navigator.vibrate && navigator.vibrate([120,60,120]); }catch(e){}
  }
}
async function startDrive(){
  if(!geoOk()){ onPosErr({code:1}); return; }
  S.drive=true; S.lastAuto=null;
  S.watchId=navigator.geolocation.watchPosition(onPos, onPosErr, {enableHighAccuracy:true, maximumAge:3000, timeout:20000});
  try{ if(navigator.wakeLock) S.wake=await navigator.wakeLock.request("screen"); }catch(e){ S.wake=null; }
  render();
}
function stopDrive(){
  S.drive=false;
  if(S.watchId!=null){ try{ navigator.geolocation.clearWatch(S.watchId); }catch(e){} S.watchId=null; }
  try{ S.wake && S.wake.release(); }catch(e){} S.wake=null;
  render();
}
function pinHere(){
  const it=findItem(S.openId); if(!it) return;
  if(it.demo){ toast("זו דוגמה. הוסף בניין אמיתי כדי לשמור."); return; }
  if(!geoOk()){ toast("אין גישה למיקום במכשיר הזה."); return; }
  toast("מאתר מיקום…");
  navigator.geolocation.getCurrentPosition(p=>{
    const cur=findItem(S.openId); if(!cur) return;
    store.save(Object.assign({},cur,{lat:p.coords.latitude,lng:p.coords.longitude,geo:"gps"}));
    onPos(p);
    toast(p.coords.accuracy>60 ? "המיקום לא מדויק (±"+Math.round(p.coords.accuracy)+" מ׳). נשמר בכל זאת — עדיף לעדכן בחוץ ליד הכניסה." : "המיקום נשמר");
  }, e=>{ onPosErr(e); toast(S.posErr); }, {enableHighAccuracy:true, timeout:15000, maximumAge:0});
}

/* ---------- import ---------- */
const CODE_LABELS="קוד|שער|לובי|דלת|חניה|חניון|בניין|מעלית|קומה";
function doorFromText(t){
  const s=norm(t);
  if(/לא להשאיר|רק ביד|למסור ביד|מסירה ביד|לא ליד הדלת/.test(s)) return "no";
  if(/להשאיר ליד|ליד הדלת|מותר להשאיר|אפשר להשאיר|על הדלת/.test(s)) return "yes";
  return "";
}
function parseLine(raw){
  let s=" "+String(raw).replace(/[\t;,|]+/g," ")+" ";
  const it={street:"",num:"",entrance:"",city:"",codes:[],door:"",name:"",phone:"",floor:"",apt:"",notes:""};
  const ph=s.match(/(?:\+972[-\s]?|0)5\d[-\s]?\d{3}[-\s]?\d{4}/);
  if(ph){ it.phone=ph[0].replace(/[\s-]/g,""); s=s.replace(ph[0]," "); }
  const en=s.match(/(?:כניסה|כנ['׳])\s*([א-ת]|\d{1,2})(?=\s)/);
  if(en){ it.entrance=en[1]; s=s.replace(en[0]," "); }
  const am=s.match(/^\s*(?:רח['׳]?\s+|רחוב\s+)?([^\d*#]+?)\s+(\d{1,4}[א-ת]?)(?:\s*\/\s*([א-ת0-9]))?(?=\s)/);
  if(am){ it.street=am[1].trim(); it.num=am[2]; if(am[3]&&!it.entrance) it.entrance=am[3]; s=" "+s.slice(am.index+am[0].length)+" "; }
  const ap=s.match(/(?:דירה|ד['׳])\s*(\d{1,4})(?=\s)/); if(ap){ it.apt=ap[1]; s=s.replace(ap[0]," "); }
  const fl=s.match(/(?:קומה|ק['׳])\s*(-?\d{1,2})(?=\s)/); if(fl){ it.floor=fl[1]; s=s.replace(fl[0]," "); }
  const re=new RegExp("(?:("+CODE_LABELS+")\\s*[:\\-]?\\s*)?([*#]?\\d[\\d*#]{2,9})(?=\\s)","g");
  s=s.replace(re,(m,label,val)=>{ it.codes.push({label:label||"קוד", value:val}); return " "; });
  it.door=doorFromText(s);
  it.notes=s.replace(new RegExp("(^|\\s)("+CODE_LABELS+")(?=\\s|$)","g")," ").replace(/\s*[:\-]\s*$/,"").replace(/\s+/g," ").trim();
  return it;
}
function mapHeader(h){
  const s=norm(h);
  if(!s) return null;
  if(/קוד|code|סיסמ/.test(s)) return "code";
  if(/טלפון|נייד|פלאפון|phone|tel/.test(s)) return "phone";
  if(/להשאיר|השאר|door/.test(s)) return "door";
  if(/כניסה|entrance/.test(s)) return "entrance";
  if(/קומה|floor/.test(s)) return "floor";
  if(/דירה|apt|apartment/.test(s)) return "apt";
  if(/עיר|ישוב|יישוב|city/.test(s)) return "city";
  if(/הער|note|מה לעשות/.test(s)) return "notes";
  if(/רחוב|כתובת|street|address/.test(s)) return "street";
  if(/מספר|^מס$|בית|number|^no$/.test(s)) return "num";
  if(/שם|name|לקוח|דייר/.test(s)) return "name";
  return null;
}
function parseCSV(text, delim){
  const rows=[]; let row=[], cell="", q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===delim){ row.push(cell); cell=""; }
    else if(c==="\n"){ row.push(cell); rows.push(row); row=[]; cell=""; }
    else if(c!=="\r") cell+=c; }
  if(cell!==""||row.length){ row.push(cell); rows.push(row); }
  return rows;
}
function rowsFromText(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length) return [];
  const tabs=lines.filter(l=>l.includes("\t")).length;
  if(tabs>=Math.max(1,lines.length*0.6)) return parseCSV(text,"\t");
  const first=lines[0];
  if(first.includes(",") && first.split(",").some(h=>mapHeader(h))) return parseCSV(text,",");
  return lines.map(l=>[l]);
}
function itemsFromRows(rows, defCity){
  rows=rows.filter(r=>r && r.some(c=>String(c??"").trim()));
  if(!rows.length) return [];
  const head=rows[0].map(mapHeader);
  const hasHeader = rows[0].length>1 && (head.includes("street")||head.includes("code"));
  const out=[];
  if(hasHeader){
    rows.slice(1).forEach(r=>{
      const it={street:"",num:"",entrance:"",city:"",codes:[],door:"",name:"",phone:"",floor:"",apt:"",notes:""};
      head.forEach((k,i)=>{ const v=String(r[i]??"").trim(); if(!v||!k) return;
        if(k==="code") it.codes.push({label:String(rows[0][i]).trim().replace(/^קוד\s*/,"")||"קוד", value:v});
        else if(k==="door"){ const n=norm(v); it.door=/^(לא|no|0|false|x)$|לא /.test(n)?"no":/^(כן|v|yes|1|true|✓|מותר)/.test(n)?"yes":doorFromText(v); }
        else it[k]= it[k] ? it[k]+" "+v : v; });
      if(it.street && !it.num && /\d/.test(it.street)){ const p=parseLine(it.street); it.street=p.street||it.street; it.num=p.num; if(!it.entrance) it.entrance=p.entrance; }
      if(!it.door) it.door=doorFromText(it.notes);
      out.push(it);
    });
  } else rows.forEach(r=>out.push(parseLine(r.join(" "))));
  out.forEach(it=>{ if(!it.city && defCity) it.city=defCity; });
  return out.map(rowToPart);
}
function rowToPart(r){
  const b={street:r.street,num:r.num,entrance:r.entrance,city:r.city,codes:r.codes||[],door:"",notes:""};
  const residents=[];
  if(r.name||r.phone||r.apt||r.floor) residents.push(Object.assign(RES_DEFAULT(),{floor:r.floor||"",apt:r.apt||"",name:r.name||"",phone:r.phone||"",door:r.door||"ask",notes:r.notes||""}));
  else { b.door=r.door||""; b.notes=r.notes||""; }
  return {b, residents};
}
function fromBackup(text){
  try{ const arr=JSON.parse(text); if(!Array.isArray(arr)) return [];
    return arr.filter(x=>x&&x.street).map(x=>{ const n=normalize(Object.assign({}, x, {id:"tmp"}));
      return {b:{street:n.street,num:n.num,entrance:n.entrance,city:n.city,codes:n.codes.filter(c=>c&&c.value),door:n.door==="ask"?"":n.door,notes:n.notes,
        lat:typeof n.lat==="number"?n.lat:undefined,lng:typeof n.lng==="number"?n.lng:undefined,history:n.history},
        residents:n.residents.map(r=>{ const c=Object.assign({},r); delete c.id; return c; })}; });
  }catch(e){ toast("קובץ הגיבוי לא תקין."); return []; }
}
function decodeText(buf){
  try{ return new TextDecoder("utf-8",{fatal:true}).decode(buf).replace(/^﻿/,""); }
  catch(e){ try{ return new TextDecoder("windows-1255").decode(buf); }catch(e2){ return new TextDecoder().decode(buf); } }
}
function loadXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((res,rej)=>{ const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload=()=>res(window.XLSX); s.onerror=()=>rej(new Error("load")); document.head.appendChild(s); });
}
function mergeResident(list, r){
  const m=list.find(x=> (r.apt && x.apt===r.apt && (!r.floor||!x.floor||x.floor===r.floor) && (!r.name||!x.name||x.name===r.name))
    || (r.phone && x.phone===r.phone) || (!r.apt && r.name && x.name===r.name && !x.apt));
  if(!m){ list.push(Object.assign(RES_DEFAULT(), r, {id:newId()})); return 1; }
  ["floor","apt","name","phone"].forEach(f=>{ if(!m[f] && r[f]) m[f]=r[f]; });
  if(r.door && r.door!=="ask") m.door=r.door;
  if(r.notes && !String(m.notes||"").includes(r.notes)) m.notes=[m.notes,r.notes].filter(Boolean).join("\n");
  if(r.history && r.history.length) m.history=[...(m.history||[]), ...r.history].slice(-40);
  return 0;
}
async function buildPlan(){
  const file=$("#impFile").files[0], pasted=$("#impText").value, defCity=$("#impCity").value.trim();
  if(!file && !pasted.trim()){ toast("בחר קובץ או הדבק רשימה."); return; }
  let parts=[];
  if(file){
    const buf=await file.arrayBuffer();
    if(/\.xlsx?$/i.test(file.name)){
      let X; try{ X=await loadXLSX(); }catch(e){ toast("לא הצלחתי לפתוח קובץ אקסל. שמור אותו כקובץ מופרד בפסיקים ונסה שוב."); return; }
      const wb=X.read(new Uint8Array(buf),{type:"array"});
      wb.SheetNames.forEach(n=>{ parts=parts.concat(itemsFromRows(X.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:""}), defCity)); });
    } else {
      const text=decodeText(buf);
      parts = /^\s*\[/.test(text) ? fromBackup(text) : itemsFromRows(rowsFromText(text), defCity);
    }
  }
  if(pasted.trim()) parts = parts.concat(/^\s*\[/.test(pasted) ? fromBackup(pasted) : itemsFromRows(rowsFromText(pasted), defCity));
  const existing=new Map(store.all().map(it=>[keyOf(it),it]));
  const planned=new Map(); let skipped=0, resCount=0;
  parts.forEach(({b,residents})=>{
    if(!b.street){ skipped++; return; }
    const k=keyOf(b);
    let entry=planned.get(k);
    if(!entry){
      const ex=existing.get(k);
      entry = ex ? {item:JSON.parse(JSON.stringify(ex)), isNew:false} : {item:normalize({id:newId(), street:b.street, num:b.num, entrance:b.entrance, city:b.city}), isNew:true};
      planned.set(k,entry);
    }
    const it=entry.item;
    ["num","entrance","city"].forEach(f=>{ if(!it[f] && b[f]) it[f]=b[f]; });
    const vals=new Set(it.codes.map(c=>c.value));
    (b.codes||[]).forEach(c=>{ if(!vals.has(c.value)){ it.codes.push({label:c.label||"קוד", value:c.value}); vals.add(c.value); } });
    if(b.door) it.door=b.door;
    if(b.notes && !String(it.notes||"").includes(b.notes)) it.notes=[it.notes,b.notes].filter(Boolean).join("\n");
    if(b.lat!=null && it.lat==null){ it.lat=b.lat; it.lng=b.lng; }
    if(b.history && b.history.length) it.history=[...it.history, ...b.history].slice(-40);
    residents.forEach(r=>{ resCount+=mergeResident(it.residents, r); });
  });
  const rows=[...planned.values()];
  S.importPlan={rows, newCount:rows.filter(r=>r.isNew).length, updCount:rows.filter(r=>!r.isNew).length, resCount, skipped};
  render();
}
async function runImport(){
  const p=S.importPlan; if(!p||S.importBusy) return;
  S.importBusy=true; render();
  const list=p.rows.map(r=>r.item); const total=list.length;
  const failed = await store.bulk(list, done=>{ const bar=$("#impProg i"); if(bar) bar.style.width=Math.round(done/total*100)+"%"; });
  S.importBusy=false;
  if(failed.length){
    failed.forEach(it=>{ const r=p.rows.find(x=>x.item.id===it.id); if(r && r.isNew) store.map.delete(it.id); });
    store.cache();
    p.rows=p.rows.filter(r=>failed.some(f=>f.id===r.item.id));
    p.newCount=p.rows.filter(r=>r.isNew).length; p.updCount=p.rows.length-p.newCount;
    render();
    toast(`נשמרו ${total-failed.length} מתוך ${total}. ${failed.length} לא נשמרו — לחץ שוב על ייבא.`);
    return;
  }
  S.importPlan=null; S.view="list"; S.q="";
  $("#q").value=""; $("#qClear").hidden=true; render(); toast(`נשמרו כל ${total} הבניינים`);
}

function saveFile(filename, data, type){
  const blob=new Blob([data],{type}); const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
}
function exportCsv(){
  const maxCodes=Math.max(1,...store.all().map(i=>(i.codes||[]).length));
  const head=["רחוב","מספר","כניסה","עיר",...Array.from({length:maxCodes},(_, i)=>"קוד "+(i+1)),"קומה","דירה","שם","טלפון","להשאיר ליד הדלת","הערות"];
  const q=v=>{ v=String(v??""); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const dz=k=>k==="yes"?"כן":k==="no"?"לא":"";
  const lines=[head.map(q).join(",")];
  sorted(store.all()).forEach(it=>{
    const codes=(it.codes||[]).map(c=>(c.label&&c.label!=="קוד"?c.label+" ":"")+c.value);
    const bcols=[it.street,it.num,it.entrance,it.city,...Array.from({length:maxCodes},(_, i)=>codes[i]||"")];
    if(!it.residents.length) lines.push([...bcols,"","","","",dz(it.door),it.notes].map(q).join(","));
    else sortRes(it.residents).forEach(r=>lines.push([...bcols,r.floor,r.apt,r.name,r.phone,dz(effDoor(r,it).k),r.notes].map(q).join(",")));
  });
  saveFile("בנק-קודים.csv", "﻿"+lines.join("\n"), "text/csv");
}

function stopInfo(st){

const AI_PROMPT=`These images come from an Israeli parcel courier's daily work: either photos of a printed delivery manifest, or screenshots of single deliveries from the courier's driver app. Text is Hebrew.

code (building entry code, e.g. from "קוד כניסה לבניין: 0159" or "מפתח 2301"; digits plus any * or # only),
door ("yes" if the yellow box says "מסירה ליד הדלת באישור הנמען" or the customer clearly allows leaving at the door; "no" if it says hand delivery only; otherwise ""),
pickup (true/false),

Floor and apartment often appear glued to the address or city, e.g. "רמת גןקומה: 2דירה: 6" → city "רמת גן", floor "2", apt "6". If the yellow box and the address disagree on the building, prefer the yellow box and mention it in notes.

  else if(act==="editRes") openResForm(S.openId, a.dataset.rid);
  else if(act==="addCode"){ $("#codeRows").insertAdjacentHTML("beforeend", codeRow({label:"קוד",value:""})); const ins=$("#codeRows").querySelectorAll(".code-inp"); ins[ins.length-1].focus(); }
  else if(act==="rmCode") a.closest(".code-row").remove();
  else if(act==="delete") arm(a,"לחץ שוב כדי למחוק את הבניין",()=>{ store.remove($("#form").dataset.id); closeSheet(); toast("הבניין נמחק"); });
  else if(act==="deleteRes") arm(a,"לחץ שוב כדי למחוק",()=>{ const f=$("#form"); const b=findItem(f.dataset.bid);
    store.save(Object.assign({}, b, {residents:b.residents.filter(r=>r.id!==f.dataset.rid)})); openCard(b.id); toast("הדייר נמחק"); });
  else if(act==="pinHere") pinHere();
  else if(act==="locate") locate();
  else if(act==="toggleDrive") S.drive?stopDrive():startDrive();
  else if(act==="hideDemo"){ S.demoDismissed=true; try{ localStorage.setItem("bank_codes_demo_off","1"); }catch(e){} render(); }
  else if(act==="addFromQuery") openForm(null, parseQueryPreset(S.q));
  else if(act==="parseImport") buildPlan();
  else if(act==="runImport") runImport();
  else if(act==="exportCsv") exportCsv();
  else if(act==="exportJson") exportJson();
  else if(act==="wipe") arm(a,`לחץ שוב כדי למחוק ${store.map.size} בניינים`,()=>{ [...store.map.keys()].forEach(id=>store.remove(id)); render(); toast("כל הנתונים נמחקו"); });
});
document.addEventListener("input", e=>{ if(e.target.id==="resQ"){ S.resQ=e.target.value; const it=findItem(S.openId); if(it) $("#resList").innerHTML=resListHtml(it); } });
document.addEventListener("submit", e=>{ if(e.target.id==="authForm"){ e.preventDefault(); doAuth("in"); return; } if(e.target.id==="newsForm"){ e.preventDefault(); submitNews(e.target); return; } if(e.target.id!=="form") return; e.preventDefault(); e.target.dataset.kind==="resident"?submitResident(e.target):submitBuilding(e.target); });
document.addEventListener("change", e=>{
  if(e.target.id==="impFile"||e.target.id==="impText") S.importPlan=null;
  if(e.target.id==="inFiles" && S.intake){ S.intake.files=[...e.target.files]; S.intake.text=($("#inText")||{}).value||""; const m=$("#inFilesMeta"); if(m) m.textContent=S.intake.files.length+" תמונות נבחרו"; }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape" && !$("#sheet").hidden) closeSheet();
  if((e.key==="Enter"||e.key===" ") && e.target.matches && e.target.matches(".stop[data-stop]")){ e.preventDefault(); openStop(e.target.dataset.stop); }
});
document.addEventListener("visibilitychange", async ()=>{ if(document.visibilityState==="visible" && S.drive && !S.wake){ try{ if(navigator.wakeLock) S.wake=await navigator.wakeLock.request("screen"); }catch(e){} } });

const dl=document.createElement("datalist"); dl.id="codeLabels";
dl.innerHTML=["קוד","שער","לובי","דלת","חניה","מעלית"].map(x=>`<option value="${x}">`).join(""); document.body.appendChild(dl);

store.start();
})();
</script>

<script>
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
</body>
</html>
